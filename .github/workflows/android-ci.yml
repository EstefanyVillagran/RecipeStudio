name: Android CI - Prácticas 13 y 14

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Dar permiso al wrapper
        run: chmod +x gradlew

      - name: Ejecutar pruebas unitarias e integración
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Ejecutar lint Android
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Subir informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas-android
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
